<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Food Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090c11;--pn:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--tx:#eef1f6;--mu:#96a0b0;--ac:#7cf2c9;--sh:0 18px 50px rgba(0,0,0,.5);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#16314a55,transparent),radial-gradient(900px 500px at 100% 0,#3b1d4a40,transparent),var(--bg);color:var(--tx);font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(9,12,17,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:10px 14px 8px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand h1{margin:0;font-size:15px;letter-spacing:.28em;font-weight:700}
.brand p{margin:0;color:var(--mu);font-size:11px}
.search{flex:1;min-width:150px;position:relative}
.search input{width:100%;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;padding-inline-end:34px;color:var(--tx);font-size:14px;outline:none}
.search input:focus{border-color:var(--ac)}
.search kbd{position:absolute;inset-inline-end:9px;top:8px;color:var(--mu);border:1px solid var(--bd);border-radius:4px;padding:0 5px;font-size:11px}
.btn{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;cursor:pointer;white-space:nowrap;transition:.2s}
.btn:hover{border-color:var(--ac)}.btn.on{background:var(--ac);color:#04130d;border-color:var(--ac);font-weight:600}
.row{display:flex;gap:6px;overflow-x:auto;padding:7px 0 1px;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;background:transparent;border:1px solid var(--bd);border-radius:6px;padding:4px 9px;font-size:11.5px;color:var(--mu);cursor:pointer;transition:.2s}
.chip:hover{color:var(--tx)}.chip.on{color:#04130d;background:var(--ac);border-color:var(--ac);font-weight:600}
.lbl{flex:none;color:var(--mu);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-right:2px}
main{padding:12px 14px 120px;max-width:1500px;margin:auto}
.stat{display:flex;justify-content:space-between;color:var(--mu);font-size:12px;margin-bottom:8px;align-items:center}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
@media(min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}}
.t{position:relative;overflow:hidden;height:92px;border-radius:5px;padding:5px 6px;text-align:start;cursor:pointer;display:flex;flex-direction:column;border:1px solid hsl(var(--h) 40% 55%/.28);background:linear-gradient(160deg,hsl(var(--h) 45% 50%/.13),hsl(var(--h) 45% 50%/.03));transition:border-color .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent}
.t:hover{border-color:hsl(var(--h) 70% 65%);box-shadow:0 0 0 1px hsl(var(--h) 70% 65%/.5),0 6px 20px #0008;z-index:2}
.t.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.t .n{font-size:9px;color:var(--mu);position:relative}
.t .f{position:absolute;left:0;right:0;bottom:0;background:hsl(var(--vh) 75% 55%/.38);transition:height .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.t b{font-size:24px;line-height:1;margin:1px 0 2px;position:relative;font-weight:400}
.t em{font-style:normal;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.t span,.t small{font-size:10px;color:#cfd6e2;position:relative;white-space:nowrap}
.t small{color:var(--mu)}
.empty{text-align:center;padding:60px 10px;color:var(--mu)}.empty big{display:block;font-size:44px}
#tip{position:fixed;pointer-events:none;z-index:50;background:rgba(14,18,26,.95);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:11.5px;opacity:0;transition:opacity .15s;backdrop-filter:blur(10px)}
@media(hover:none){#tip{display:none}}
.ov{position:fixed;inset:0;z-index:40;background:rgba(3,5,8,.65);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:rgba(18,23,32,.96);border:1px solid var(--bd);border-radius:14px 14px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(30px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ov.on .sheet{transform:none}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:14px}}
.sheet.wide{width:min(760px,100%)}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.hd .em{font-size:44px;line-height:1}.hd h2{margin:0;font-size:18px}
.tag{display:inline-block;font-size:10.5px;border:1px solid var(--bd);border-radius:5px;padding:1px 6px;color:var(--mu);margin:3px 0 0;margin-inline-end:4px}
.x{margin-inline-start:auto;align-self:flex-start;background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer}
.seg{display:flex;gap:4px;margin:8px 0 12px}.seg .chip{flex:1;text-align:center}.seg .chip[disabled]{opacity:.3;cursor:not-allowed}
.mid{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.big{font-size:30px;font-weight:700;line-height:1}.big small{font-size:12px;color:var(--mu);font-weight:400}
.leg{font-size:11px;color:var(--mu)}.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-inline-end:4px}
.bar{display:grid;grid-template-columns:70px 1fr 74px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.bar .tr{height:7px;background:rgba(255,255,255,.07);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;width:0;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar .v{text-align:end;font-variant-numeric:tabular-nums}.bar .v small{color:var(--mu)}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.note{color:var(--mu);font-size:10.5px;margin-top:12px}
.cm{margin:12px 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.cb{display:grid;grid-template-columns:96px 1fr 58px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.cb span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tray{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(14,18,26,.92);backdrop-filter:blur(14px);border-top:1px solid var(--bd);transform:translateY(110%);transition:transform .3s}
#tray.on{transform:none}#tray .ch{display:flex;gap:6px;flex:1;overflow-x:auto}
.pill{flex:none;border:1px solid var(--bd);border-radius:20px;padding:3px 9px;cursor:pointer;background:var(--pn)}
select{background:#121820;border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.mr{display:grid;grid-template-columns:30px 1fr 74px 28px;gap:8px;align-items:center;margin:6px 0}
.mr input{width:100%;background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:6px;color:var(--tx);font-size:14px}
.plate{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;min-height:70px;margin:12px 0;border-radius:50%/20px;background:radial-gradient(closest-side,#ffffff0d,transparent)}
.plate span{transition:font-size .4s;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}to{transform:none}}
.seg2{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 10px}.seg2 i{transition:width .5s}
.tot{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.tot div{background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:7px 2px}.tot b{display:block;font-size:16px}.tot small{color:var(--mu);font-size:10px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{background:linear-gradient(180deg,rgba(16,21,30,.92),rgba(9,12,17,.84));box-shadow:0 1px 0 rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.3)}
.brand h1{background:linear-gradient(90deg,#fff 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn,.chip{min-height:34px;display:inline-flex;align-items:center;justify-content:center}
.btn:active,.chip:active,.t:active{transform:scale(.97)}
.t{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 3px rgba(0,0,0,.35)}
.t:hover{transform:translateY(-2px)}
.sheet{box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.07)}
.sp{flex:1}.lay{display:flex;gap:4px;margin-inline-end:6px}.lay .chip{padding:3px 10px}
.act{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.act:empty{display:none}
.act .pill{font-size:11.5px;color:var(--ac);border-color:rgba(124,242,201,.35);background:rgba(124,242,201,.08);min-height:28px}
.empty h3{margin:6px 0;color:var(--tx)}.empty p{margin:0 0 10px}.sug{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.ov{transition:opacity .25s,visibility 0s}.ov:not(.on){visibility:hidden;transition:opacity .25s,visibility 0s .25s}
#more{display:block}
#grid.list{grid-template-columns:1fr;gap:4px}
.t.r{height:auto;min-height:54px;flex-direction:row;align-items:center;gap:10px;padding:7px 10px;border-radius:8px}
.t.r:hover{transform:none;background:linear-gradient(90deg,hsl(var(--h) 45% 50%/.2),hsl(var(--h) 45% 50%/.05))}
.t.r b{font-size:24px;width:30px;text-align:center;margin:0}
.t.r .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.t.r em{font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--tx)}
.t.r .nm small{font-size:11px;color:hsl(var(--h) 55% 72%)}
.t.r .kc{width:52px;text-align:end;font-size:15px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.t.r .kc small{display:block;font-size:9.5px;font-weight:400;color:var(--mu)}
.t.r .mc{position:relative;width:46px;text-align:end;font-size:12.5px;color:var(--tx);padding-bottom:7px;font-variant-numeric:tabular-nums}
.t.r .mc small{font-size:9.5px;color:var(--mu);margin-inline-start:1px}
.t.r .mc::after,.t.r .mc i{content:'';position:absolute;left:0;bottom:0;height:3px;border-radius:2px}
.t.r .mc::after{right:0;background:rgba(255,255,255,.08)}
.t.r .mc i{width:var(--w);background:var(--c);z-index:1}
@media(min-width:900px){#grid.list{grid-template-columns:1fr 1fr}.t.r .mc{width:60px}}
@media(min-width:700px){#bf{display:none}}
@media(max-width:699px){#more{display:none}#more.open{display:block}.search{order:5;flex-basis:100%}header{padding:8px 12px 6px}main{padding:10px 12px 120px}.chip{padding:6px 12px;font-size:12.5px}.sheet{max-height:92vh}.btn{padding:8px 10px}.brand{flex:1}}
@media(max-width:439px){.t.r .mc.o{display:none}}
@media(prefers-reduced-motion:reduce){*,::before,::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---------- i18n / RTL (Kurdish Sorani) ---------- */
[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select{font-family:"Vazirmatn","Noto Sans Arabic","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif}
[dir=rtl] body{line-height:1.55}
[dir=rtl] *{letter-spacing:0!important;text-transform:none!important}
[dir=rtl] .t:not(.r){height:102px}
[dir=rtl] .bar{grid-template-columns:96px 1fr 84px}
[dir=rtl] .cb{grid-template-columns:104px 1fr 64px}
[dir=rtl] .c2,[dir=rtl] .c2h{grid-template-columns:1fr 96px 1fr}
[dir=rtl] .brand p{font-size:12px}
/* ---------- v2: micronutrients, favorites ---------- */
.bar{grid-template-columns:70px 1fr 84px}
.cb{grid-template-columns:96px 1fr 64px}
.t.fv::after{content:'★';position:absolute;top:3px;inset-inline-end:5px;font-size:10px;color:#ffd166}
/* ---------- v3: serving cards ---------- */
.sv{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:0 0 10px}
.sv.h100{background:transparent}.sv.h100 .tot b{font-size:14px;color:#cfd6e2}
.svh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:8px}
.svn{font-size:15px;font-weight:600;line-height:1.25}.svn small{color:var(--mu);font-weight:400;font-size:12px}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}
/* v4: portion slider + 2-food compare */
.pg{display:flex;align-items:baseline;gap:6px;margin-bottom:2px}
.pg input{width:84px;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;color:var(--tx);font-size:22px;font-weight:700;text-align:end}
.pg span{color:var(--mu)}
#pr{width:100%;accent-color:var(--ac);margin:8px 0 6px}
.pc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.c2,.c2h{display:grid;grid-template-columns:1fr 84px 1fr;gap:8px;align-items:center}
.c2h{font-size:13px;font-weight:600;padding:4px 0 8px;border-bottom:1px solid var(--bd)}
.c2h span:first-child{text-align:end}
.c2{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.c2l{text-align:center;font-size:11px;color:var(--mu)}
.c2v{font-size:15px;font-variant-numeric:tabular-nums}
.c2v:first-child{text-align:end}
.hi{color:var(--ac);font-weight:700}.lo{color:var(--mu)}
.hi i,.lo i{font-style:normal;font-size:10px;margin:0 4px}.lo i{color:#ff9f5a}

/* ---------- Search ---------- */
const QR=[ /* [pattern, predicate, sort key, direction] — add a row to support a new phrase */
 [/\blow[ -]?cal(orie)?s?\b/,f=>f.kcal<=60,'kcal','asc'],
 [/\bprotein\b/,f=>f.protein>=15,'protein','desc'],
 [/\bfib(er|re)\b/,f=>f.fiber>=6,'fiber','desc'],
 [/\bsugar\b/,f=>f.sugar>=15,'sugar','desc'],
 [/\bpotassium\b/,f=>f.k>=300,'k','desc'],
 [/\bcalcium\b/,f=>f.ca>=100,'ca','desc'],
 [/\biron\b/,f=>f.fe>=2,'fe','desc'],
 [/\bvit(amin)?[ -]?c\b/,f=>f.vc>=30,'vc','desc']];
const nz=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/ى/g,'ی');
const KT={'پرۆتین':'protein','فایبەر':'fiber','شەکر':'sugar','پۆتاسیۆم':'potassium','کالسیۆم':'calcium','ئاسن':'iron','ڤیتامین':'vitamin','سی':'c'},KF=new Set(['زۆر','بەرز','دەوڵەمەند','تێدا','خۆراک','خۆراکی','خۆراکەکان','لە','بە']);
function parseQ(q){let r=nz(q.toLowerCase());const tests=[];let sk=null,sd=null;
 r=r.replace(/کالۆری کەم|کەم کالۆری/g,'low calorie').split(/\s+/).map(w=>KT[w]||KT[w.replace(/ی$/,'')]||w).join(' ');
 const mu=r.match(/(?:under|below|less than|<|کەمتر لە)\s*([\d٠-٩]+)\s*(?:k?cal\w*|کالۆری)?/);
 if(mu){const n=+mu[1].replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));r=r.replace(mu[0],' ');tests.push(f=>f.kcal<n);sk='kcal';sd='asc'}
 QR.forEach(([re,t,k,d])=>{if(re.test(r)){r=r.replace(re,' ');tests.push(t);if(!sk){sk=k;sd=d}}});
 return{tests,sk,sd,r:r.replace(/\b(high|rich|in|of|foods?|with|lots)\b/g,' ').split(/\s+/).filter(w=>w&&!KF.has(w)).join(' ')}}

function filter(){

 if(S.q.trim()){const p=parseQ(S.q);p.tests.forEach(t=>L=L.filter(t));
  if(p.r)L=L.filter(f=>(f.name+' '+CATS[f.cat][0]).toLowerCase().includes(p.r)||f.nameKu.includes(p.r)||CK[f.cat].includes(p.r));
  if(!ks){ks=p.sk;kd=p.sd}}
 if(S.maxK)L=L.filter(f=>f.kcal<S.maxK);
 if(ks)L=[...L].sort((a,b)=>kd==='desc'?b[ks]-a[ks]:a[ks]-b[ks]);
 return S.lim?L.slice(0,S.lim):L}

 $('#ac').onclick=()=>{toggleCmp(f.id);drawDetail()};
 $('#af').onclick=()=>{toggleFav(f);drawDetail();const t=document.querySelector(`.t[data-id="${f.id}"]`);if(t)t.classList.toggle('fv',S.fav.has(f.name))};
 $('#am').onclick=()=>{addMeal(f.id,S.amt);$('#am').textContent=$t('added');};
 sh.querySelector('details').ontoggle=bars;bars();
 $('#pr').oninput=e=>setAmt(e.target.value,'pr');$('#pg').oninput=e=>setAmt(e.target.value,'pg');
 sh.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>setAmt(b.dataset.g))}
const refBars=(f,k)=>MET.map(m=>f[m[0]]==null?'':barRow(m,f[m[0]]*k,m[0]==='water'?f.water:f[m[0]]*k/m[3]*100)).join('');
function setAmt(g,src){g=Math.round(+g);if(!(g>0))return;g=Math.min(1000,g);S.amt=g;const f=FOODS[S.cur],k=g/100;
 if(src!=='pg')$('#pg').value=g;if(src!=='pr')$('#pr').value=Math.min(g,500);
 $('#pt').innerHTML=tiles(f,k);$('#h1').hidden=g===100;
 const rb=$('#rb');rb.innerHTML=refBars(f,k);rb.querySelectorAll('[data-w]').forEach(e=>{e.style.transition='none';e.style.width=e.dataset.w+'%'});
 sh.querySelectorAll('[data-g]').forEach(b=>b.classList.toggle('on',+b.dataset.g===g))}

/* ---------- Compare ---------- */
function toggleCmp(id){const i=S.cmp.indexOf(id);if(i>=0)S.cmp.splice(i,1);else if(S.cmp.length<4)S.cmp.push(id);else{$('#cnt').textContent=$t('max4')}tray()}
function tray(){const t=$('#tray');t.classList.toggle('on',S.cmp.length>0||S.cmpMode);$('#tch').innerHTML=S.cmp.length?S.cmp.map(i=>`<span class=pill data-r="${i}">${FOODS[i].e} ${fn(FOODS[i])} ×</span>`).join(''):`<span style="color:var(--mu)">${$t('tap')}</span>`;$('#tgo').disabled=S.cmp.length<2;$('#tgo').style.opacity=S.cmp.length<2?.4:1;document.querySelectorAll('.t').forEach(e=>e.classList.toggle('sel',S.cmp.includes(+e.dataset.id)))}
$('#tch').onclick=e=>{const p=e.target.closest('[data-r]');if(p)toggleCmp(+p.dataset.r)};
$('#tclr').onclick=()=>{S.cmp=[];S.cmpMode=false;$('#bc').classList.remove('on');tray()};
$('#tgo').onclick=openCmp;
$('#bc').onclick=()=>{S.cmpMode=!S.cmpMode;$('#bc').classList.toggle('on',S.cmpMode);tray()};
const PAL=['#7cf2c9','#6cb6ff','#ffd166','#ff7eb6'];
function openCmp(){if(S.cmp.length<2)return;const fs=S.cmp.map(i=>FOODS[i]),sv=S.cu==='serving',K=f=>sv?f.servingGrams/100:1,two=fs.length===2,nm=f=>fn(f).split(' (')[0];
 const rows=[...MET.slice(0,7),...MET.slice(8).filter(m=>fs.some(f=>f[m[0]]!=null))];
 const val=(f,m)=>f[m[0]]==null?null:f[m[0]]*K(f),txt=(v,m)=>v==null?'—':fm(v)+(m[2]==='kcal'?'':' '+un(m[2]));
 const rank=(vs,i)=>{if(vs.includes(null))return'';const hi=Math.max(...vs),lo=Math.min(...vs);return hi===lo?'':vs[i]===hi?'hi':vs[i]===lo?'lo':''};
 const mk=r=>r==='hi'?'<i>▲</i>':r==='lo'?'<i>▼</i>':'';
 const head=two?`<div class=c2h>${[0,1].map(i=>`<span>${fs[i].e} ${nm(fs[i])}</span>`).join('<span></span>')}</div>`:'';
 const body=two?rows.map(m=>{const vs=fs.map(f=>val(f,m)),r=i=>rank(vs,i);return `<div class=c2><span class="c2v ${r(0)}">${mk(r(0))}${txt(vs[0],m)}</span><span class=c2l>${mn(m)}</span><span class="c2v ${r(1)}">${txt(vs[1],m)}${mk(r(1))}</span></div>`}).join('')
 :rows.map(m=>{const vs=fs.map(f=>val(f,m)),mx=Math.max(...vs.map(v=>v||0),.001);return `<div class=cm>${mn(m)}</div>`+fs.map((f,i)=>{const r=rank(vs,i);return `<div class=cb><span>${f.e} ${nm(f)}</span><div class=bar style="display:block;margin:0"><div class=tr><i data-w="${(vs[i]||0)/mx*100}" style="background:${PAL[i]};opacity:${r!=='lo'?1:.65}"></i></div></div><span class="v ${r}" style="text-align:end">${txt(vs[i],m)}${mk(r)}</span></div>`}).join('')}).join('');
 sh.innerHTML=`<div class=hd><h2>${fs.map(f=>f.e+' '+nm(f)).join(' '+$t('vs')+' ')}</h2><button class=x>×</button></div>
 <div class=seg>${[['100g',$t('p100')],['serving',$t('tsv')]].map(([a,b])=>`<button class="chip${S.cu===a?' on':''}" data-cu="${a}">${b}</button>`).join('')}</div>
 <div class=leg>${sv?fs.map(f=>`${f.e} ${sdesc(f)} (${f.servingGrams} ${$t('u_g')})`).join(' · '):$t('p100')} · ${$t('hl')}${two?'':' · '+$t('scl')}</div>${head}${body}
 <p class=note>${$t('ncmp')}</p>`;
 sh.querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{S.cu=b.dataset.cu;openCmp()});
 openOv(true);bars()}

/* ---------- Meal builder / daily tracker ---------- */
function addMeal(id,g){const m=S.meal.find(x=>x.id===id);if(m)m.g+=g;else S.meal.push({id,g});$('#mc').textContent=S.meal.length;saveDay()}
$('#bm').onclick=openMeal;
function openMeal(){
 saveDay();const T=Object.fromEntries(MET.map(m=>[m[0],0]));S.meal.forEach(x=>{const f=FOODS[x.id];for(const k in T)T[k]+=(f[k]||0)*x.g/100});
 const e=[T.protein*4,T.carbs*4,T.fat*9],et=e.reduce((a,b)=>a+b,0)||1;
 sh.innerHTML=`<div class=hd><h2>${$t('build')}</h2><button class=x>×</button></div>
 <select id=ms><option value="">${$t('addfood')}</option>${Object.entries(CATS).map(([c,v])=>`<optgroup label="${cn(c)}">${FOODS.filter(f=>f.cat===c).map(f=>`<option value=${f.id}>${f.e} ${fn(f)}</option>`).join('')}</optgroup>`).join('')}</select>
 <div class=plate>${S.meal.length?S.meal.map(x=>`<span style="font-size:${24+Math.sqrt(x.g)*1.6}px">${FOODS[x.id].e}</span>`).join(''):'<span style="color:var(--mu);font-size:12px;animation:none">'+$t('plate')+'</span>'}</div>
 ${S.meal.map((x,i)=>`<div class=mr><span style="font-size:22px">${FOODS[x.id].e}</span><span>${fn(FOODS[x.id])}</span><input type=number min=0 inputmode=numeric value=${x.g} data-i=${i}><button class=x style="margin:0" data-d=${i}>×</button></div>`).join('')}
 <div class=seg2>${e.map((v,i)=>`<i style="width:${v/et*100}%;background:${['#7cf2c9','#6cb6ff','#ffd166'][i]}"></i>`).join('')}</div>
 <div class=tot><div><b>${Math.round(T.kcal)}</b><small>${$t('u_kcal')}</small></div>${['protein','carbs','fat','fiber'].map(k=>`<div><b>${fm(T[k])}${$t('u_g')}</b><small>${ml(k).toLowerCase()}</small></div>`).join('')}</div>
 ${S.meal.length?`<div class=cm>${$t('today')}</div>`+MET.filter(m=>m[0]!=='water').map(m=>barRow(m,T[m[0]],T[m[0]]/m[3]*100)).join('')+`<div class=acts><button class=btn id=mx>${$t('clr')}</button></div>`:''}
 <p class=note>${$t('nm')}</p>`;
 $('#ms').onchange=ev=>{if(ev.target.value){addMeal(+ev.target.value,100);openMeal()}};
 sh.querySelectorAll('input[data-i]').forEach(inp=>inp.onchange=()=>{S.meal[+inp.dataset.i].g=Math.max(0,+inp.value||0);openMeal()});
 sh.querySelectorAll('[data-d]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();S.meal.splice(+b.dataset.d,1);$('#mc').textContent=S.meal.length;openMeal()});
 if($('#mx'))$('#mx').onclick=()=>{S.meal=[];$('#mc').textContent=0;openMeal()};
 openOv();bars()}
function rowHTML(f){const x=['fiber','sugar'].includes(S.sk)?S.sk:['fiber','sugar'].includes(S.view)?S.view:'fat',M=[['protein','P','#7cf2c9'],['carbs','C','#6cb6ff'],x==='fat'?['fat','F','#ffd166']:[x,x==='fiber'?'Fi':'Su',x==='fiber'?'#a3e635':'#ff7eb6']];
 return `<button class="t r${S.cmp.includes(f.id)?' sel':''}${S.fav.has(f.name)?' fv':''}" data-id="${f.id}" aria-label="${fn(f)}, ${f.kcal} ${$t('u_kcal')} ${$t('per100')}" style="--h:${CATS[f.cat][1]}"><b>${f.e}</b><span class=nm><em>${fn(f)}</em><small>${cn(f.cat)}${f.est?' · '+$t('est2'):''}</small></span><span class=kc>${f.kcal}<small>${$t('u_kcal')}/100${$t('u_g')}</small></span>${M.map(([k,l,c],j)=>`<span class="mc${j?' o':''}"><i style="--w:${Math.min(100,Math.sqrt(f[k]/MX[k])*100)}%;--c:${c}"></i>${fm(f[k])}<small>${$t('ab_'+l)}</small></span>`).join('')}</button>`}
function setQ(s){reset();S.q=s;$('#q').value=s;draw()}
function badges(f){const b=[];if(f.protein>=20)b.push([$t('b_hp'),'#7cf2c9']);if(f.kcal&&f.kcal<=60)b.push([$t('b_lc'),'#a3e635']);if(f.fiber>=6)b.push([$t('b_hf'),'#a3e635']);if(f.sugar>=15)b.push([$t('b_hs'),'#ff7eb6']);if(f.carbs<=5&&f.kcal>40)b.push([$t('b_lb'),'#6cb6ff']);if(f.na>=500)b.push([$t('b_hn'),'#b79cff']);if(f.k>=500)b.push([$t('b_pk'),'#c4b5fd']);return b.map(([t,c])=>`<span class=tag style="color:${c};border-color:${c}55">${t}</span>`).join('')}
function activeChips(){const a=[];if(S.q.trim())a.push(['q','“'+S.q.trim()+'”']);if(S.cat!=='all')a.push(['cat',S.cat==='fav'?$t('fav'):cn(S.cat)]);if(S.sk)a.push(['sk',$t('sb',mn(MET.find(m=>m[0]===S.sk)))+(S.sd==='desc'?' ↓':' ↑')]);if(S.maxK)a.push(['mk',$t('uk',S.maxK)]);if(S.lim)a.push(['lim',$t('top',S.lim)]);
 $('#act').innerHTML=a.map(([k,x])=>`<button class=pill data-x="${k}" aria-label="${$t('rmf')}: ${x}">${x} ×</button>`).join('');$('#rs').hidden=!a.length&&S.view==='none';
 [['#lg','grid'],['#ll','list']].forEach(([s,l])=>{$(s).classList.toggle('on',S.lay===l);$(s).setAttribute('aria-pressed',S.lay===l)})}
$('#act').onclick=e=>{const b=e.target.closest('[data-x]');if(!b)return;const k=b.dataset.x;if(k==='q'){S.q='';$('#q').value=''}if(k==='cat')S.cat='all';if(k==='sk'){S.sk=null;S.label=''}if(k==='mk')S.maxK=0;if(k==='lim')S.lim=0;draw()};
$('#lg').onclick=()=>{S.lay='grid';draw()};$('#ll').onclick=()=>{S.lay='list';draw()};
$('#bf').onclick=()=>{const o=$('#more').classList.toggle('open');$('#bf').setAttribute('aria-expanded',o);$('#bf').classList.toggle('on',o)};
new MutationObserver(()=>sh.querySelectorAll('.x:not([aria-label])').forEach(b=>b.setAttribute('aria-label',$t('close')))).observe(sh,{childList:true});
addEventListener('keydown',e=>{if(e.key!=='Tab'||!ov.classList.contains('on'))return;const f=[...sh.querySelectorAll('button:not([disabled]),select,input')];if(!f.length)return;const a=f[0],z=f[f.length-1],c=document.activeElement;if(e.shiftKey&&(c===a||c===sh)){e.preventDefault();z.focus()}else if(!e.shiftKey&&c===z){e.preventDefault();a.focus()}});
$('#lt').onclick=e=>{const b=e.target.closest('[data-l]');if(b&&b.dataset.l!==lang)setLang(b.dataset.l)};
setLang(lang);
</script></body></html>
